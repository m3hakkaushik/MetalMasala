# [L20] Local-only MongoDB with persistent data for the database lectures.
services:
  mongo:
    image: mongo:7
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
